[package]
name = "haven_vetkeys"
version = "0.1.0"
edition = "2021"

[lib]
name = "haven_vetkeys"
crate-type = ["cdylib"]

[dependencies]
# Pinned exact: this is the audited VetKD client. @icp-sdk/vetkeys 0.5.0 (what the
# dapp uses against this canister) shipped the same day as ic-vetkeys 0.8.0/0.8.1,
# so the 0.8 line is the protocol match. Never float this casually.
ic-vetkeys = "=0.8.1"
jni = "0.21"
base64 = "0.22"
rand = "0.9"
zeroize = "1"
